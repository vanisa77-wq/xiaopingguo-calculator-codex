<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小蘋果計算機">
  <meta name="theme-color" content="#F6E8D2">
  <link rel="apple-touch-icon" href="app-icon.png?v=2">
  <link rel="icon" type="image/png" href="app-icon.png?v=2">
  <title>小蘋果計算機 v2</title>
  <style>
    :root {
      --bg: #F6E8D2;
      --panel: #F6E8D2;
      --panel-soft: #FFFDF8;
      --line: #D9876C;
      --ink: #3F403C;
      --muted: #686862;
      --number: #FAF4E8;
      --operator: #D9876C;
      --function: #D8AA43;
      --warning: #82AAA1;
      --complete: #486B7B;
      --selected: #C8DCD6;
      --selected-accent: #5F8C83;
      --cream: var(--number);
      --gold: #cda06b;
      --green: var(--function);
      --green-dark: #28442c;
      --red: var(--warning);
      --orange: var(--operator);
      --brown: var(--complete);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--panel);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "PingFang TC", sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
    }

    .calculator {
      width: min(100%, 430px);
      min-height: calc(100svh - max(26px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      background: transparent;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: none;
      align-items: baseline;
      gap: 10px;
      padding-left: 8px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 800;
      color: #96613c;
    }

    .version {
      font-size: 20px;
      font-weight: 800;
      color: #9b8066;
    }

    .screen {
      height: clamp(400px, 48svh, 470px);
      border: 3px solid var(--line);
      border-radius: 26px;
      background: var(--panel-soft);
      display: flex;
      flex-direction: column;
      padding: 18px 24px 19px;
      overflow: hidden;
    }

    .tape {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 0 16px;
      scrollbar-width: none;
      scroll-snap-type: y proximity;
    }

    .tape::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: clamp(15px, 2.1svh, 18px);
      font-weight: 800;
      line-height: 1.45;
      white-space: nowrap;
    }

    .entry {
      border-bottom: 1px solid var(--operator);
      padding: 7px 0 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: start;
      column-gap: 8px;
      width: 100%;
      border-radius: 0;
      cursor: pointer;
      transition: background .16s ease, padding .16s ease;
      scroll-snap-align: start;
    }

    .entry.selected {
      padding-left: 10px;
      padding-right: 8px;
      background: var(--selected);
      box-shadow: inset 4px 0 0 var(--selected-accent);
    }

    .entry.selected .expr {
      color: #4A4D49;
    }

    .entry.selected .entry-title,
    .entry.selected .answer {
      color: #303531;
    }

    .entry-title {
      grid-column: 1 / -1;
      color: var(--ink);
      font-size: 17px;
      font-weight: 650;
      line-height: 1.35;
      margin-bottom: 2px;
    }

    .entry .expr {
      color: #68625B;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.25;
      text-align: left;
      min-width: 0;
      max-width: none;
      white-space: normal;
      overflow: visible;
      overflow-wrap: anywhere;
      text-overflow: clip;
    }

    .entry .answer {
      color: var(--ink);
      font-size: 19px;
      font-weight: 650;
      line-height: 1.25;
      white-space: nowrap;
    }

    .entry .copied {
      color: #8c6947;
      font-size: 13px;
      font-weight: 700;
      grid-column: 1 / -1;
      min-height: 0;
      text-align: right;
    }

    .entry .copied:empty {
      display: none;
    }

    .number-label {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: 15px;
      font-weight: 400;
      vertical-align: baseline;
      white-space: nowrap;
    }

    .entry-badge {
      padding: 2px 8px;
      border: 2px solid var(--gold);
      border-radius: 8px;
      color: #76502f;
      background: rgba(255, 249, 242, .55);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .divider {
      height: 2px;
      background: var(--operator);
      flex: 0 0 auto;
      opacity: .9;
    }

    .input-line {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      padding-top: 14px;
      padding-bottom: 8px;
      color: var(--ink);
      font-size: clamp(31px, 7svh, 49px);
      font-weight: 500;
      line-height: 1.05;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      flex-wrap: nowrap;
    }

    .cursor {
      width: 4px;
      height: .98em;
      background: var(--ink);
      display: inline-block;
      margin-left: 4px;
      animation: blink 1.05s steps(2, start) infinite;
    }

    .display-text {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .display-answer {
      color: var(--ink);
      font-size: 1.12em;
      font-weight: 750;
    }

    .draft-title {
      min-height: 22px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 650;
      text-align: right;
      padding-top: 4px;
    }

    .draft-title:empty {
      min-height: 0;
      padding: 0;
    }

    .inline-number-label {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: 15px;
      font-weight: 400;
      vertical-align: baseline;
    }

    .number-label::after,
    .inline-number-label::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: .9em;
      margin: 0 2px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .entry .inline-number-label {
      margin: 0;
      padding: 0;
      border-radius: 0;
      font-size: 15px;
      line-height: 1.25;
      vertical-align: baseline;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .copy-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 36px;
      transition: min-height .18s ease, opacity .18s ease;
    }

    .copy-row:not(:empty) {
      margin-bottom: 8px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .memory-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      appearance: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      border: 0;
      min-width: 0;
      height: clamp(58px, 6.5svh, 64px);
      border-radius: 18px;
      color: var(--ink);
      background: var(--cream);
      box-shadow: none;
      font: inherit;
      font-size: clamp(34px, 5.6svh, 48px);
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .ans,
    .set-x,
    .copy,
    .share-action {
      background: var(--function);
      color: var(--ink);
      font-size: clamp(22px, 3.1svh, 27px);
      white-space: nowrap;
    }

    .ans,
    .set-x {
      padding-inline: 4px;
      font-size: clamp(14px, 2svh, 18px);
    }

    .set-x {
      background: var(--function);
      color: var(--ink);
      font-weight: 900;
    }

    .set-x .x-mark {
      font-size: 1.18em;
      font-weight: 950;
    }

    .copy {
      font-weight: 500;
      font-size: clamp(16px, 2.1svh, 19px);
    }

    .share-action {
      background: var(--function);
      color: var(--ink);
      font-size: clamp(16px, 2.1svh, 19px);
      font-weight: 700;
    }

    .copy-row button {
      width: auto;
      height: 36px;
      padding-inline: 14px;
      border-radius: 11px;
    }

    .note-action {
      background: var(--function);
      color: var(--ink);
      font-size: clamp(16px, 2.1svh, 19px);
      font-weight: 800;
    }

    .result-badge {
      height: 36px;
      padding-inline: 14px;
      border: 2px solid var(--gold);
      border-radius: 11px;
      color: #76502f;
      background: rgba(255, 249, 242, .55);
      font-size: clamp(16px, 2.1svh, 19px);
      font-weight: 700;
      line-height: 32px;
      white-space: nowrap;
    }

    button[data-dot] {
      padding-bottom: 14px;
    }

    .backspace,
    .paren {
      background: var(--function);
      color: var(--ink);
    }

    .backspace {
      font-size: clamp(28px, 4.2svh, 40px);
    }

    .invoice {
      background: var(--function);
      color: var(--ink);
      font-size: clamp(17px, 2.3svh, 21px);
    }

    .tax {
      background: var(--function);
      color: var(--ink);
      font-size: clamp(17px, 2.3svh, 21px);
    }

    .utility-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .memory-row button,
    .utility-row button {
      height: clamp(52px, 6svh, 58px);
      padding-inline: 2px;
      border-radius: 16px;
    }

    .utility-row .paren,
    .utility-row .clear,
    .utility-row .op {
      font-size: clamp(28px, 4.3svh, 40px);
    }

    .clear {
      background: var(--warning);
      color: var(--ink);
    }

    .op {
      background: var(--operator);
      color: #fff;
    }

    .equals {
      background: var(--complete);
      color: #fff;
    }

    .notice {
      min-height: 19px;
      color: #8f5f3c;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .note-panel {
      width: 100%;
      max-width: none;
      padding: 6px 8px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--panel-soft);
    }

    .note-panel[hidden] {
      display: none;
    }

    .note-panel-form {
      display: grid;
      gap: 6px;
    }

    .note-fields {
      display: grid;
      grid-template-columns: repeat(3, max-content);
      gap: 5px 8px;
    }

    .note-field {
      display: grid;
      grid-template-columns: max-content 78px;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .note-field.formula-field {
      grid-template-columns: max-content 90px;
    }

    .note-field-label {
      color: #6f543e;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .note-field-input {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding-inline: 8px;
      border: 2px solid #cfb184;
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      background: #fffaf4;
      font: inherit;
      font-size: 16px;
      user-select: text;
    }

    .note-field-input:focus {
      border-color: #9f7357;
    }

    .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .note-actions button {
      width: auto;
      height: 34px;
      padding-inline: 10px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
    }

    dialog {
      width: min(calc(100% - 28px), 420px);
      max-height: min(82svh, 720px);
      padding: 0;
      border: 2px solid var(--line);
      border-radius: 24px;
      color: var(--ink);
      background: var(--panel-soft);
      box-shadow: 0 20px 60px rgba(72, 43, 23, .28);
      overflow: hidden;
    }

    dialog::backdrop {
      background: rgba(58, 38, 24, .35);
      backdrop-filter: blur(3px);
    }

    .dialog-body {
      padding: 22px;
      overflow-y: auto;
      max-height: min(82svh, 720px);
    }

    .dialog-body h2 {
      margin: 0 0 6px;
      color: #76502f;
      font-size: 23px;
    }

    .dialog-help {
      margin: 0 0 18px;
      color: #8d735e;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.5;
    }

    .field-label {
      display: block;
      margin: 14px 0 6px;
      color: #6f543e;
      font-size: 14px;
      font-weight: 800;
    }

    .text-field {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 2px solid #cfb184;
      border-radius: 12px;
      outline: none;
      color: var(--ink);
      background: #fffaf4;
      font: inherit;
      font-size: 17px;
      user-select: text;
    }

    .text-field:focus {
      border-color: #b7765f;
      box-shadow: 0 0 0 3px rgba(183, 118, 95, .13);
    }

    .label-editor-list {
      display: grid;
      gap: 9px;
    }

    .label-editor-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .label-editor-number {
      color: #76502f;
      font-size: 16px;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog-actions button,
    .scope-button {
      width: auto;
      height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 17px;
    }

    .dialog-cancel {
      background: #ded0bc;
      color: #59422f;
    }

    .dialog-save {
      background: var(--orange);
      color: #fff;
    }

    .scope-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .scope-button {
      width: 100%;
      justify-content: flex-start;
      background: #fff9f2;
      color: #654a34;
      border: 2px solid rgba(196, 160, 108, .55);
    }

    .scope-button:disabled {
      opacity: .42;
      cursor: default;
    }

    @media (max-width: 390px) {
      body {
        padding-inline: 10px;
      }

      .calculator {
        padding: 28px 24px 26px;
        border-radius: 27px;
        gap: 14px;
      }

      h1 {
        font-size: 28px;
      }

      .version {
        font-size: 18px;
      }

      .screen {
        padding-inline: 20px;
        height: clamp(350px, 46svh, 440px);
      }

      .keypad {
        gap: 10px;
      }

      .note-panel {
        padding-inline: 6px;
      }

      .note-panel-form {
        gap: 4px;
      }

      .note-fields {
        grid-template-columns: repeat(3, max-content);
        gap: 4px 6px;
      }

      .note-field {
        grid-template-columns: max-content 64px;
      }

      .note-field.formula-field {
        grid-template-columns: max-content 76px;
      }

      .note-actions button {
        padding-inline: 7px;
        font-size: 13px;
      }

      button {
        border-radius: 16px;
      }
    }

    @media (max-height: 780px) {
      .calculator {
        padding-top: 24px;
        padding-bottom: 22px;
        gap: 12px;
      }

      .screen {
        height: 270px;
      }

      button {
        height: 56px;
      }

      .memory-row button,
      .utility-row button {
        height: 50px;
      }

      .screen {
        height: 340px;
      }
    }

    @media (max-width: 340px) {
      .note-fields {
        grid-template-columns: repeat(2, max-content);
      }

      .note-field.formula-field {
        grid-column: auto;
      }
    }

    /* 手機觸控時縮小按鍵死角；滑鼠版維持原本間距。 */
    @media (hover: none) and (pointer: coarse) {
      .keypad,
      .memory-row,
      .utility-row {
        gap: 7px;
      }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="小蘋果計算機">
    <header>
      <h1>小蘋果計算機</h1>
      <span class="version">v2</span>
    </header>

    <section class="screen" aria-live="polite">
      <div class="tape" id="tape">
        <div class="empty" id="empty">尚無計算記錄</div>
      </div>
      <div class="copy-row hidden" id="copyRow"></div>
      <div class="draft-title" id="draftTitle"></div>
      <div class="input-line" id="display"><span class="cursor"></span></div>
      <div class="divider"></div>
    </section>

    <section class="note-panel" id="notePanel" aria-label="註記編輯區" hidden>
      <form class="note-panel-form" id="noteForm">
        <div class="note-fields" id="noteFields"></div>
        <div class="note-actions">
          <button class="dialog-cancel" type="button" id="cancelNote">取消</button>
          <button class="dialog-save" type="submit">儲存</button>
        </div>
      </form>
    </section>

    <section class="keypad" aria-label="計算機按鍵">
      <div class="memory-row">
        <button class="ans" data-ans="round0">ANS 0</button>
        <button class="ans" data-ans="round2">ANS .00</button>
        <button class="ans" data-ans="ceil">ANS ↑</button>
        <button class="set-x" id="setX">設<span class="x-mark">𝒳</span></button>
        <button class="backspace" id="backspace" aria-label="刪除">⌫</button>
      </div>

      <div class="utility-row">
        <button class="paren" id="paren">( )</button>
        <button class="tax" id="tax">5%稅</button>
        <button class="invoice" id="invoice">發票</button>
        <button class="clear" id="clear">AC</button>
        <button class="op" data-op="÷">÷</button>
      </div>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button data-num="00">00</button>
      <button data-num="0">0</button>
      <button data-dot=".">.</button>
      <button class="equals" id="equals">=</button>
    </section>
    <div class="notice" id="notice"></div>
  </main>

  <dialog id="screenshotDialog">
    <div class="dialog-body">
      <h2>選擇截圖內容</h2>
      <p class="dialog-help">註記、數字標籤與計算時間會一起保留。</p>
      <div class="scope-list">
        <button class="scope-button" type="button" data-shot-scope="current">目前算式</button>
        <button class="scope-button" type="button" data-shot-scope="selected">選擇的歷史算式</button>
        <button class="scope-button" type="button" data-shot-scope="all">全部計算紀錄</button>
      </div>
      <div class="dialog-actions">
        <button class="dialog-cancel" type="button" id="cancelScreenshot">取消</button>
      </div>
    </div>
  </dialog>

  <script>
    const display = document.getElementById("display");
    const tape = document.getElementById("tape");
    const empty = document.getElementById("empty");
    const copyRow = document.getElementById("copyRow");
    const notice = document.getElementById("notice");
    const draftTitleElement = document.getElementById("draftTitle");
    const notePanel = document.getElementById("notePanel");
    const noteForm = document.getElementById("noteForm");
    const noteFields = document.getElementById("noteFields");
    const screenshotDialog = document.getElementById("screenshotDialog");
    const operators = new Set(["+", "−", "×", "÷"]);
    const xSymbol = "𝒳";
    const storageKey = "littleAppleCalculatorAnnotatedRecordsV1";

    let expression = "";
    let completedExpression = "";
    let lastAnswer = null;
    let savedX = null;
    let copiedPrincipal = null;
    let invoicePrincipal = null;
    let clearOnNextNumber = false;
    let deleteTimer = null;
    let noticeTimer = null;
    let draftTitle = "";
    let draftLabels = [];
    let draftResultLabel = "";
    let records = loadRecords();
    let activeRecordId = records.at(-1)?.id || null;
    let selectedRecordId = null;
    let noteEditingRecordId = null;
    let noteKeyboardScrollY = null;

    function render() {
      const activeRecord = clearOnNextNumber
        ? records.find(record => record.id === activeRecordId)
        : null;
      const text = activeRecord
        ? recordFormulaHtml(activeRecord, true)
        : annotatedExpressionHtml(expression, draftLabels);
      draftTitleElement.textContent = activeRecord?.title || draftTitle;
      display.style.fontSize = "";
      display.innerHTML = "";
      const textElement = document.createElement("span");
      textElement.className = "display-text";
      if (text) {
        textElement.innerHTML = text;
      }
      display.append(textElement);
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      display.append(cursor);
      fitDisplayText(textElement, cursor);
    }

    function loadRecords() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || "[]");
        if (!Array.isArray(stored)) return [];
        return stored.slice(-100).map(record => ({
          id: String(record.id || `${Date.now()}-${Math.random()}`),
          expr: String(record.expr || ""),
          answer: String(record.answer || ""),
          badgeLabel: String(record.badgeLabel || ""),
          title: String(record.title || ""),
          labels: Array.isArray(record.labels) ? record.labels.map(value => String(value || "")) : [],
          resultLabel: String(record.resultLabel || ""),
          createdAt: record.createdAt || new Date().toISOString()
        }));
      } catch {
        return [];
      }
    }

    function persistRecords() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(records.slice(-100)));
      } catch {
        flash("記錄暫時無法保存");
      }
    }

    function numberValues(value) {
      return String(value || "").match(/(?:\d+(?:\.\d*)?|\.\d+)/g) || [];
    }

    function annotatedExpressionHtml(value, labels = []) {
      let result = "";
      let lastIndex = 0;
      let numberIndex = 0;
      const text = String(value || "");
      const matcher = /(?:\d+(?:\.\d*)?|\.\d+)/g;
      let match;
      while ((match = matcher.exec(text))) {
        result += escapeHtml(text.slice(lastIndex, match.index));
        const label = labels[numberIndex] || "";
        if (label) {
          result += `<span class="inline-number-label">${escapeHtml(label)}</span>`;
        }
        result += escapeHtml(match[0]);
        lastIndex = match.index + match[0].length;
        numberIndex += 1;
      }
      return result + escapeHtml(text.slice(lastIndex));
    }

    function recordFormulaHtml(record, includeAnswer = false) {
      const expressionHtml = annotatedExpressionHtml(record.expr, record.labels);
      if (!includeAnswer) return expressionHtml;
      const resultTag = record.resultLabel
        ? `<span class="inline-number-label">${escapeHtml(record.resultLabel)}</span>`
        : "";
      return `<span class="display-expression">${expressionHtml} = </span><span class="display-answer">${resultTag}${escapeHtml(record.answer)}</span>`;
    }

    function annotatedExpressionText(value, labels = []) {
      let result = "";
      let lastIndex = 0;
      let numberIndex = 0;
      const text = String(value || "");
      const matcher = /(?:\d+(?:\.\d*)?|\.\d+)/g;
      let match;
      while ((match = matcher.exec(text))) {
        result += text.slice(lastIndex, match.index);
        const label = labels[numberIndex] || "";
        if (label) result += `${label}|`;
        result += match[0];
        lastIndex = match.index + match[0].length;
        numberIndex += 1;
      }
      return result + text.slice(lastIndex);
    }

    function recordToText(record) {
      const formula = `${annotatedExpressionText(record.expr, record.labels)}=${record.resultLabel ? `${record.resultLabel}|` : ""}${record.answer}`;
      return record.title ? `${record.title}\n${formula}` : formula;
    }

    function fitDisplayText(textElement, cursor) {
      let size = parseFloat(getComputedStyle(display).fontSize);
      const minimumSize = 13;

      while (
        textElement.scrollWidth + cursor.offsetWidth + 8 > display.clientWidth &&
        size > minimumSize
      ) {
        size -= 1;
        display.style.fontSize = `${size}px`;
      }
    }

    function flash(message) {
      notice.textContent = message;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => {
        notice.textContent = "";
      }, 1800);
    }

    function tokenBeforeCursor() {
      return expression.at(-1) || "";
    }

    function currentNumberChunk() {
      const parts = expression.split(/[+−×÷()𝒳]/);
      return parts.at(-1) || "";
    }

    function isValueToken(token) {
      return /\d/.test(token) || token === "." || token === ")" || token === xSymbol;
    }

    function appendNumber(value) {
      if (clearOnNextNumber) {
        expression = "";
        completedExpression = "";
        invoicePrincipal = null;
        clearOnNextNumber = false;
        activeRecordId = null;
        draftTitle = "";
        draftLabels = [];
        draftResultLabel = "";
      }
      selectedRecordId = null;
      const prev = tokenBeforeCursor();
      if (prev === ")" || prev === xSymbol) {
        expression += "×";
      }
      expression += value;
      hideCopyChoices();
      render();
    }

    function appendDot() {
      if (clearOnNextNumber) {
        expression = "";
        completedExpression = "";
        invoicePrincipal = null;
        clearOnNextNumber = false;
        activeRecordId = null;
        draftTitle = "";
        draftLabels = [];
        draftResultLabel = "";
      }
      selectedRecordId = null;
      const prev = tokenBeforeCursor();
      if (prev === ")" || prev === xSymbol) {
        expression += "×0.";
      } else if (!currentNumberChunk()) {
        expression += "0.";
      } else if (!currentNumberChunk().includes(".")) {
        expression += ".";
      }
      hideCopyChoices();
      render();
    }

    function appendOperator(op) {
      clearOnNextNumber = false;
      completedExpression = "";
      selectedRecordId = null;
      activeRecordId = null;
      hideCopyChoices();
      if (!expression) {
        if (op === "−") expression = "−";
        render();
        return;
      }

      const prev = tokenBeforeCursor();
      if (operators.has(prev)) {
        expression = expression.slice(0, -1) + op;
      } else if (prev === "(") {
        if (op === "−") expression += op;
      } else if (prev === xSymbol) {
        expression += op;
      } else {
        expression += op;
      }
      render();
    }

    function smartParen() {
      clearOnNextNumber = false;
      completedExpression = "";
      selectedRecordId = null;
      activeRecordId = null;
      hideCopyChoices();
      const open = [...expression].filter(ch => ch === "(").length;
      const close = [...expression].filter(ch => ch === ")").length;
      const prev = tokenBeforeCursor();
      const canClose = prev && !operators.has(prev) && prev !== "(" && (
        open > close || (open === close && /[+−]/.test(expression) && !expression.includes("("))
      );

      if (canClose) {
        expression += ")";
      } else {
        if (prev && isValueToken(prev)) {
          expression += "×";
        }
        expression += "(";
      }
      render();
    }

    function backspaceOnce() {
      if (clearOnNextNumber) {
        clearOnNextNumber = false;
        activeRecordId = null;
      }
      selectedRecordId = null;
      completedExpression = "";
      hideCopyChoices();
      expression = expression.slice(0, -1);
      draftLabels = draftLabels.slice(0, numberValues(expression).length);
      render();
    }

    function clearInput() {
      expression = "";
      completedExpression = "";
      invoicePrincipal = null;
      clearOnNextNumber = false;
      activeRecordId = null;
      selectedRecordId = null;
      draftTitle = "";
      draftLabels = [];
      draftResultLabel = "";
      hideCopyChoices();
      renderTape();
      render();
    }

    function normalizeExpression(input) {
      let text = input.replaceAll("−", "-").replaceAll("×", "*").replaceAll("÷", "/");
      if (text.includes(xSymbol)) {
        if (savedX === null) throw new Error("還沒有設定 𝒳");
        text = text.replaceAll(xSymbol, `(${compactNumber(savedX)})`);
      }
      const open = (text.match(/\(/g) || []).length;
      const close = (text.match(/\)/g) || []).length;
      if (close > open) text = "(".repeat(close - open) + text;
      if (open > close) text += ")".repeat(open - close);
      text = text.replace(/([)\d.])\(/g, "$1*(").replace(/\)([\d.])/g, ")*$1");
      return text;
    }

    function tokenize(text) {
      const tokens = [];
      let index = 0;
      while (index < text.length) {
        const ch = text[index];
        if (/\s/.test(ch)) {
          index += 1;
          continue;
        }
        if (/[0-9.]/.test(ch)) {
          let number = ch;
          index += 1;
          while (index < text.length && /[0-9.]/.test(text[index])) {
            number += text[index];
            index += 1;
          }
          if ((number.match(/\./g) || []).length > 1 || number === ".") {
            throw new Error("小數點格式不對");
          }
          tokens.push({ type: "number", value: Number(number) });
          continue;
        }
        if ("+-*/()".includes(ch)) {
          tokens.push({ type: ch });
          index += 1;
          continue;
        }
        throw new Error("算式裡有不能計算的符號");
      }
      return tokens;
    }

    function parseExpression(tokens) {
      let pos = 0;

      function peek() {
        return tokens[pos];
      }

      function consume(type) {
        if (peek()?.type === type) {
          pos += 1;
          return true;
        }
        return false;
      }

      function primary() {
        if (consume("+")) return primary();
        if (consume("-")) return -primary();
        if (consume("(")) {
          const value = additive();
          if (!consume(")")) throw new Error("括號還沒關好");
          return value;
        }
        const token = peek();
        if (!token || token.type !== "number") throw new Error("算式還沒完成");
        pos += 1;
        return token.value;
      }

      function multiplicative() {
        let value = primary();
        while (peek() && (peek().type === "*" || peek().type === "/")) {
          const op = peek().type;
          pos += 1;
          const right = primary();
          if (op === "/" && right === 0) throw new Error("不能除以 0");
          value = op === "*" ? value * right : value / right;
        }
        return value;
      }

      function additive() {
        let value = multiplicative();
        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const op = peek().type;
          pos += 1;
          const right = multiplicative();
          value = op === "+" ? value + right : value - right;
        }
        return value;
      }

      const result = additive();
      if (pos !== tokens.length) throw new Error("算式還沒完成");
      return result;
    }

    function evaluate(input) {
      const normalized = normalizeExpression(input);
      return parseExpression(tokenize(normalized));
    }

    function prettyNumber(value, maxDigits = 12) {
      const rounded = Math.abs(value) < 1e-12 ? 0 : value;
      return Number(rounded.toPrecision(maxDigits)).toLocaleString("en-US", {
        maximumFractionDigits: 10
      });
    }

    function compactNumber(value) {
      return String(Number(value.toPrecision(12)));
    }

    function answerVersions(value) {
      return {
        round0Label: String(Math.round(value)),
        round2Label: Number(value.toFixed(2)).toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }),
        ceilLabel: String(Math.ceil(value)),
        round0Value: String(Math.round(value)),
        round2Value: String(Number(value.toFixed(2))),
        ceilValue: String(Math.ceil(value))
      };
    }

    function isIntegerAnswer(value) {
      return Math.abs(value - Math.round(value)) < 1e-10;
    }

    function calculate() {
      if (!expression || operators.has(tokenBeforeCursor()) || tokenBeforeCursor() === "(") {
        flash("算式還沒完成");
        return;
      }

      try {
        const original = expression;
        const result = evaluate(expression);
        if (!Number.isFinite(result)) throw new Error("結果太大了");
        lastAnswer = result;
        invoicePrincipal = result;
        const shown = prettyNumber(result);
        const record = addTapeEntry(original, shown);
        expression = shown.replaceAll(",", "");
        completedExpression = `${original} = ${shown}`;
        clearOnNextNumber = true;
        activeRecordId = record.id;
        selectedRecordId = record.id;
        renderTape();
        showCopyChoices(result, "", record);
        render();
      } catch (error) {
        flash(error.message || "這題暫時算不出來");
      }
    }

    function scrollTapeToBottom() {
      requestAnimationFrame(() => {
        tape.scrollTop = tape.scrollHeight;
      });
    }

    function scrollRecordIntoView(recordId) {
      requestAnimationFrame(() => {
        const item = [...tape.querySelectorAll(".entry")]
          .find(entry => entry.dataset.recordId === recordId);
        if (!item) return;

        const tapeRect = tape.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();

        if (itemRect.top < tapeRect.top) {
          tape.scrollTop += itemRect.top - tapeRect.top;
        } else if (itemRect.bottom > tapeRect.bottom) {
          tape.scrollTop += itemRect.bottom - tapeRect.bottom;
        }
      });
    }

    function useStoredX() {
      if (lastAnswer !== null && clearOnNextNumber) {
        savedX = lastAnswer;
        addTapeEntry(xSymbol, prettyNumber(savedX));
        flash(`已設定 ${xSymbol} = ${prettyNumber(savedX)}`);
        return;
      }

      if (savedX === null) {
        flash(`先算出答案，再按設${xSymbol}`);
        return;
      }

      if (clearOnNextNumber) {
        expression = "";
        completedExpression = "";
        invoicePrincipal = null;
        clearOnNextNumber = false;
      }

      const prev = tokenBeforeCursor();
      if (prev && isValueToken(prev)) {
        expression += "×";
      }
      expression += xSymbol;
      hideCopyChoices();
      render();
    }

    function addTapeEntry(expr, answer, badgeLabel = "") {
      const record = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        expr: String(expr),
        answer: String(answer),
        badgeLabel: String(badgeLabel),
        title: draftTitle,
        labels: [...draftLabels],
        resultLabel: draftResultLabel,
        createdAt: new Date().toISOString()
      };
      records.push(record);
      records = records.slice(-100);
      draftTitle = "";
      draftLabels = [];
      draftResultLabel = "";
      persistRecords();
      renderTape();
      scrollTapeToBottom();
      return record;
    }

    function renderTape() {
      tape.innerHTML = "";
      if (!records.length) {
        empty.hidden = false;
        tape.append(empty);
        return;
      }

      empty.hidden = true;
      records.forEach(record => {
        const item = document.createElement("article");
        item.className = `entry${record.id === selectedRecordId ? " selected" : ""}`;
        item.dataset.recordId = record.id;
        const resultTag = record.resultLabel
          ? `<span class="number-label">${escapeHtml(record.resultLabel)}</span>`
          : "";
        item.innerHTML = `
          ${record.title ? `<div class="entry-title">${escapeHtml(record.title)}</div>` : ""}
          <div class="expr">${formatTapeExpression(record.expr, record.labels)} =</div>
          <div class="answer">${resultTag}${escapeHtml(record.answer)}</div>
          ${record.badgeLabel ? `<span class="entry-badge">${escapeHtml(record.badgeLabel)}</span>` : ""}
          <div class="copied"></div>
        `;
        item.addEventListener("click", () => {
          selectedRecordId = record.id;
          renderTape();
          scrollRecordIntoView(record.id);
          renderActionRow(record);
          flash("已選擇這筆算式");
        });
        tape.append(item);
      });
    }

    function formatTapeExpression(value, labels = []) {
      return annotatedExpressionHtml(value, labels).replace(/([+−×÷])/g, "$1<wbr>");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[ch]);
    }

    function hideCopyChoices() {
      tape.querySelector(".entry.selected")?.classList.remove("selected");
      renderActionRow(null);
    }

    function showCopyChoices(value, badgeLabel = "", record = null) {
      const chosenRecord = record || records.find(item => item.id === activeRecordId);
      renderActionRow(chosenRecord, value, badgeLabel);
      scrollTapeToBottom();
    }

    function renderActionRow(record = null, value = null, badgeLabel = "") {
      copyRow.innerHTML = "";
      copyRow.classList.remove("hidden");
      if (badgeLabel) {
        const badge = document.createElement("span");
        badge.className = "result-badge";
        badge.textContent = badgeLabel;
        copyRow.append(badge);
      }
      if (record) {
        addCopyButton(
          "複製",
          recordToText(record),
          "single",
          Number(record.answer.replaceAll(",", ""))
        );
        addShareButton();
      } else if (value !== null && Number.isFinite(Number(value))) {
        addCopyButton("複製", compactNumber(Number(value)), "single");
        addShareButton();
      } else if (expression || records.length) {
        addShareButton();
      }
      addNoteButton();
    }

    function addCopyButton(label, value, extraClass = "", principal = null) {
      const button = document.createElement("button");
      button.className = `copy ${extraClass}`.trim();
      button.textContent = label;
      button.addEventListener("click", () => {
        if (principal !== null && Number.isFinite(principal)) {
          copiedPrincipal = principal;
          invoicePrincipal = principal;
        }
        copyText(value);
      });
      copyRow.append(button);
    }

    function addShareButton() {
      const button = document.createElement("button");
      button.className = "share-action";
      button.textContent = "截圖";
      button.addEventListener("click", openScreenshotOptions);
      copyRow.append(button);
    }

    function addNoteButton() {
      const button = document.createElement("button");
      button.className = "note-action";
      button.textContent = "＋註記";
      button.addEventListener("click", openNoteEditor);
      copyRow.append(button);
    }

    function openNoteEditor() {
      const selected = records.find(record => record.id === selectedRecordId);
      const active = clearOnNextNumber
        ? records.find(record => record.id === activeRecordId)
        : null;
      const record = selected || active || null;
      const values = record ? numberValues(record.expr) : numberValues(expression);
      if (!record && (!expression || operators.has(tokenBeforeCursor()) || tokenBeforeCursor() === "(")) {
        values.push("下一個數字");
      }

      noteEditingRecordId = record?.id || null;
      noteFields.innerHTML = "";
      addCompactNoteField("title", "算式", record?.title || draftTitle, true);
      const labels = record?.labels || draftLabels;
      values.forEach((value, index) => {
        addCompactNoteField(
          `number:${index}`,
          value === "下一個數字" ? "下一個" : value,
          labels[index] || ""
        );
      });
      if (record) addCompactNoteField("result", record.answer, record.resultLabel || "");

      notePanel.hidden = false;
    }

    function addCompactNoteField(target, label, value, formulaField = false) {
      const wrapper = document.createElement("label");
      wrapper.className = `note-field${formulaField ? " formula-field" : ""}`;
      const labelElement = document.createElement("span");
      labelElement.className = "note-field-label";
      labelElement.textContent = label;
      const input = document.createElement("input");
      input.className = "note-field-input";
      input.maxLength = formulaField ? 16 : 10;
      input.dataset.noteTarget = target;
      input.value = value;
      input.lang = "zh-Hant";
      input.inputMode = "text";
      input.autocomplete = "off";
      input.autocapitalize = "none";
      input.spellcheck = false;
      input.setAttribute("autocorrect", "off");
      input.setAttribute("aria-label", `${label}的註記`);
      wrapper.append(labelElement, input);
      noteFields.append(wrapper);
    }

    function closeNoteEditor() {
      const returnScrollY = noteKeyboardScrollY;
      if (notePanel.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      notePanel.hidden = true;
      noteKeyboardScrollY = null;
      if (returnScrollY !== null) {
        setTimeout(() => window.scrollTo(0, returnScrollY), 80);
      }
    }

    function saveNoteEditor() {
      const record = records.find(item => item.id === noteEditingRecordId);
      const inputs = [...noteFields.querySelectorAll("[data-note-target]")];

      inputs.forEach(input => {
        const target = input.dataset.noteTarget;
        const value = input.value.trim();
        if (record) {
          if (target === "title") {
            record.title = value;
          } else if (target === "result") {
            record.resultLabel = value;
          } else {
            const index = Number(target.split(":")[1]);
            record.labels[index] = value;
          }
        } else if (target === "title") {
          draftTitle = value;
        } else {
          const index = Number(target.split(":")[1]);
          draftLabels[index] = value;
        }
      });

      if (record) {
        persistRecords();
        renderTape();
        scrollRecordIntoView(record.id);
        renderActionRow(record);
      }

      noteEditingRecordId = null;
      render();
      flash("註記已儲存");
    }

    function currentScreenshotRecord() {
      const active = records.find(record => record.id === activeRecordId);
      if (clearOnNextNumber && active) return active;
      if (!expression) return null;
      return {
        id: "current",
        expr: expression,
        answer: "",
        badgeLabel: "計算中",
        title: draftTitle,
        labels: [...draftLabels],
        resultLabel: "",
        createdAt: new Date().toISOString()
      };
    }

    function openScreenshotOptions() {
      const current = currentScreenshotRecord();
      const selected = records.find(record => record.id === selectedRecordId);
      screenshotDialog.querySelector('[data-shot-scope="current"]').disabled = !current;
      screenshotDialog.querySelector('[data-shot-scope="selected"]').disabled = !selected;
      screenshotDialog.querySelector('[data-shot-scope="all"]').disabled = !records.length;
      screenshotDialog.showModal();
    }

    function drawRoundedRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.lineTo(x + width - radius, y);
      context.quadraticCurveTo(x + width, y, x + width, y + radius);
      context.lineTo(x + width, y + height - radius);
      context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      context.lineTo(x + radius, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - radius);
      context.lineTo(x, y + radius);
      context.quadraticCurveTo(x, y, x + radius, y);
      context.closePath();
    }

    function wrapCanvasText(context, text, maxWidth) {
      const parts = String(text).match(/(?:[+−×÷=]?[^+−×÷=]+)|[+−×÷=]/g) || [String(text)];
      const lines = [];
      let line = "";
      parts.forEach(part => {
        const test = line + part;
        if (line && context.measureText(test).width > maxWidth) {
          lines.push(line);
          line = part;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    }

    function screenshotFormula(record) {
      const left = annotatedExpressionText(record.expr, record.labels).replace(/\s+/g, "");
      if (!record.answer) return `${left}（計算中）`;
      return `${left}=${record.resultLabel ? `${record.resultLabel}|` : ""}${record.answer}`.replace(/\s+/g, "");
    }

    function screenshotLineItems(record) {
      if (!record.answer || (record.labels || []).filter(Boolean).length < 2) return [];

      const rows = [];
      const matcher = /\d+(?:\.\d+)?/g;
      let match;
      let previousEnd = 0;
      let index = 0;

      while ((match = matcher.exec(record.expr))) {
        const between = record.expr.slice(previousEnd, match.index);
        const operator = (between.match(/[+−×÷]/g) || []).at(-1) || "";
        const numeric = Number(match[0]);
        rows.push({
          label: record.labels[index] || `項目 ${index + 1}`,
          amount: Number.isFinite(numeric) ? prettyNumber(numeric) : match[0],
          operator: index === 0 ? "" : operator
        });
        previousEnd = match.index + match[0].length;
        index += 1;
      }

      return rows;
    }

    function estimatedScreenshotRecordHeight(record) {
      const rows = screenshotLineItems(record);
      const titleHeight = record.title ? 66 : 0;
      const badgeHeight = record.badgeLabel ? 44 : 0;
      if (rows.length) {
        return titleHeight + badgeHeight + rows.length * 68 + 125;
      }
      return titleHeight + badgeHeight + Math.ceil(screenshotFormula(record).length / 30) * 72 + 80;
    }

    function estimatedScreenshotWidth(items) {
      const measureCanvas = document.createElement("canvas");
      const measureContext = measureCanvas.getContext("2d");
      let contentRight = 0;

      items.forEach(record => {
        if (record.title) {
          measureContext.font = '800 54px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          contentRight = Math.max(contentRight, 115 + measureContext.measureText(record.title).width);
        }

        const rows = screenshotLineItems(record);
        if (rows.length) {
          rows.forEach(row => {
            measureContext.font = '500 46px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
            const labelWidth = measureContext.measureText(row.label).width;
            measureContext.font = '700 46px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
            const amountWidth = measureContext.measureText(row.amount).width;
            contentRight = Math.max(contentRight, 185 + labelWidth + 38 + amountWidth);
          });

          measureContext.font = '500 48px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          const totalLabelWidth = measureContext.measureText(record.resultLabel || "合計").width;
          measureContext.font = '800 58px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          const totalAmountWidth = measureContext.measureText(record.answer).width;
          contentRight = Math.max(contentRight, 185 + totalLabelWidth + 38 + totalAmountWidth);
        } else {
          measureContext.font = '700 54px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          contentRight = Math.max(
            contentRight,
            115 + Math.min(950, measureContext.measureText(screenshotFormula(record)).width)
          );
        }
      });

      return Math.min(1200, Math.max(650, Math.ceil(contentRight + 115)));
    }

    async function shareCalculationImage(items) {
      if (!items.length) {
        flash("目前沒有可以截圖的算式");
        return;
      }

      const canvas = document.createElement("canvas");
      canvas.width = estimatedScreenshotWidth(items);
      canvas.height = Math.max(
        340,
        150
          + items.reduce((height, record) => height + estimatedScreenshotRecordHeight(record), 0)
          + Math.max(0, items.length - 1) * 42
      );
      const context = canvas.getContext("2d");

      context.fillStyle = "#F3DED3";
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawRoundedRect(context, 35, 35, canvas.width - 70, canvas.height - 70, 42);
      context.fillStyle = "#FFF9F4";
      context.fill();
      context.lineWidth = 8;
      context.strokeStyle = "#D9876C";
      context.stroke();

      drawRoundedRect(context, 50, 50, canvas.width - 100, canvas.height - 100, 32);
      context.lineWidth = 3;
      context.strokeStyle = "#E9C7B8";
      context.stroke();

      // 讓標題、明細與合計整組在內框中垂直置中，
      // 避免內容過度貼近上緣而產生懸吊感。
      let y = 138;
      items.forEach((record, index) => {
        if (record.title) {
          context.fillStyle = "#87503F";
          context.font = '800 54px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          context.textAlign = "left";
          context.fillText(record.title, 115, y);
          y += 64;
        }

        const lineItems = screenshotLineItems(record);
        if (lineItems.length) {
          const operatorLabels = { "+": "＋", "−": "－", "×": "×", "÷": "÷" };
          const labelFont = '500 46px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          const amountFont = '700 46px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          const totalLabelFont = '500 48px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          const totalAmountFont = '800 58px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          const minimumGap = 38;
          const amountRightRequirements = lineItems.map(row => {
            context.font = labelFont;
            const labelWidth = context.measureText(row.label).width;
            context.font = amountFont;
            const amountWidth = context.measureText(row.amount).width;
            return 185 + labelWidth + minimumGap + amountWidth;
          });
          context.font = totalLabelFont;
          const totalLabelWidth = context.measureText(record.resultLabel || "合計").width;
          context.font = totalAmountFont;
          const totalAmountWidth = context.measureText(record.answer).width;
          amountRightRequirements.push(185 + totalLabelWidth + minimumGap + totalAmountWidth);
          const amountColumnX = Math.min(canvas.width - 115, Math.max(420, ...amountRightRequirements));

          lineItems.forEach(row => {
            context.fillStyle = "#4B4541";
            context.font = labelFont;
            context.textAlign = "left";
            if (row.operator) {
              context.fillText(operatorLabels[row.operator] || row.operator, 135, y);
            }
            context.fillText(row.label, 185, y);

            context.fillStyle = "#302E2B";
            context.font = amountFont;
            context.textAlign = "right";
            context.fillText(row.amount, amountColumnX, y);
            y += 68;
          });

          context.strokeStyle = "#D8AA43";
          context.lineWidth = 3;
          context.beginPath();
          context.moveTo(135, y - 22);
          context.lineTo(amountColumnX + 24, y - 22);
          context.stroke();

          context.fillStyle = "#87503F";
          context.font = totalLabelFont;
          context.textAlign = "left";
          context.fillText(record.resultLabel || "合計", 185, y + 38);

          context.fillStyle = "#302E2B";
          context.font = totalAmountFont;
          context.textAlign = "right";
          context.fillText(record.answer, amountColumnX, y + 38);
          y += 100;
        } else {
          context.fillStyle = "#302E2B";
          context.font = '700 54px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          context.textAlign = "left";
          const lines = wrapCanvasText(context, screenshotFormula(record), canvas.width - 230);
          lines.forEach(line => {
            context.fillText(line, 115, y);
            y += 72;
          });
        }

        if (record.badgeLabel) {
          context.fillStyle = "#87503F";
          context.font = '700 28px -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif';
          context.fillText(record.badgeLabel, 115, y);
          y += 44;
        }

        if (index < items.length - 1) {
          context.strokeStyle = "#E9C7B8";
          context.lineWidth = 2;
          context.beginPath();
          context.moveTo(115, y + 10);
          context.lineTo(canvas.width - 115, y + 10);
          context.stroke();
          y += 58;
        }
      });

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!blob) {
        flash("圖片產生失敗，請再試一次");
        return;
      }

      const shareText = items.map(recordToText).join("\n\n");
      const file = new File([blob], "小蘋果計算紀錄.png", { type: "image/png" });
      try {
        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file], title: "小蘋果計算紀錄" });
        } else if (navigator.share) {
          await navigator.share({ title: "小蘋果計算紀錄", text: shareText });
        } else {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = file.name;
          link.click();
          URL.revokeObjectURL(link.href);
          flash("算式圖片已儲存");
        }
      } catch (error) {
        if (error.name !== "AbortError") flash("無法分享，請再試一次");
      }
    }

    async function copyText(text) {
      const numericValue = Number(text);
      if (Number.isFinite(numericValue)) {
        copiedPrincipal = numericValue;
        invoicePrincipal = numericValue;
      }

      try {
        await navigator.clipboard.writeText(text);
        flash(/[|\n]/.test(text) ? "已複製算式與註記" : `已複製 ${text}`);
      } catch {
        flash("請長按答案手動複製");
      }
    }

    function getInvoiceAmounts() {
      const directInput = expression.replaceAll(",", "").replace("−", "-").trim();
      const hasDirectAmount = !clearOnNextNumber && /^-?\d+(?:\.\d+)?$/.test(directInput);
      const principal = hasDirectAmount
        ? Number(directInput)
        : invoicePrincipal ?? copiedPrincipal;

      if (principal === null || !Number.isFinite(principal)) {
        flash("請直接輸入金額，或先按複製");
        return null;
      }

      invoicePrincipal = principal;
      const tax = Math.round(principal * 0.05 + Number.EPSILON);
      const total = Math.round((principal + tax + Number.EPSILON) * 100) / 100;
      return {
        principal,
        tax,
        total,
        principalShown: prettyNumber(principal),
        taxShown: prettyNumber(tax),
        totalShown: prettyNumber(total)
      };
    }

    function showCalculatedAmount(value, formula, message, badgeLabel, record) {
      lastAnswer = value;
      expression = compactNumber(value);
      completedExpression = formula;
      clearOnNextNumber = true;
      activeRecordId = record?.id || null;
      selectedRecordId = record?.id || null;
      renderTape();
      showCopyChoices(value, badgeLabel, record);
      render();
      flash(message);
    }

    function calculateTax() {
      const amounts = getInvoiceAmounts();
      if (!amounts) return;

      const formula = `${amounts.principalShown} × 5% = ${amounts.taxShown}`;
      const record = addTapeEntry(`${amounts.principalShown} × 5%`, amounts.taxShown, "稅金");
      showCalculatedAmount(amounts.tax, formula, `5%稅金 ${amounts.taxShown}`, "稅金", record);
    }

    function calculateInvoice() {
      const amounts = getInvoiceAmounts();
      if (!amounts) return;

      const formula = `${amounts.principalShown} + ${amounts.taxShown} = ${amounts.totalShown}`;
      const record = addTapeEntry(
        `${amounts.principalShown} + ${amounts.taxShown}`,
        amounts.totalShown,
        "發票"
      );
      showCalculatedAmount(amounts.total, formula, `發票總額 ${amounts.totalShown}`, "發票", record);
    }

    function useAnswer(mode) {
      if (lastAnswer === null) {
        flash("先算一題才有 ANS");
        return;
      }
      const versions = answerVersions(lastAnswer);
      expression = mode === "round2" ? versions.round2Value : mode === "round0" ? versions.round0Value : versions.ceilValue;
      clearOnNextNumber = false;
      showCopyChoices(Number(expression));
      render();
    }

    document.querySelectorAll("[data-num]").forEach(button => {
      button.addEventListener("click", () => appendNumber(button.dataset.num));
    });

    document.querySelector("[data-dot]").addEventListener("click", appendDot);

    document.querySelectorAll("[data-op]").forEach(button => {
      button.addEventListener("click", () => appendOperator(button.dataset.op));
    });

    document.querySelectorAll("[data-ans]").forEach(button => {
      button.addEventListener("click", () => useAnswer(button.dataset.ans));
    });

    document.getElementById("paren").addEventListener("click", smartParen);
    document.getElementById("tax").addEventListener("click", calculateTax);
    document.getElementById("invoice").addEventListener("click", calculateInvoice);
    document.getElementById("setX").addEventListener("click", useStoredX);
    document.getElementById("clear").addEventListener("click", clearInput);
    document.getElementById("equals").addEventListener("click", calculate);

    function restoreNoteKeyboardScroll() {
      if (noteKeyboardScrollY === null || !notePanel.contains(document.activeElement)) return;
      window.scrollTo(0, noteKeyboardScrollY);
    }

    notePanel.addEventListener("pointerdown", event => {
      if (event.target.matches(".note-field-input")) {
        noteKeyboardScrollY = window.scrollY;
      }
    });
    notePanel.addEventListener("focusin", event => {
      if (!event.target.matches(".note-field-input")) return;
      if (noteKeyboardScrollY === null) noteKeyboardScrollY = window.scrollY;
      requestAnimationFrame(restoreNoteKeyboardScroll);
      setTimeout(restoreNoteKeyboardScroll, 160);
      setTimeout(restoreNoteKeyboardScroll, 360);
    });
    notePanel.addEventListener("focusout", () => {
      setTimeout(() => {
        if (!notePanel.contains(document.activeElement)) noteKeyboardScrollY = null;
      }, 0);
    });
    window.visualViewport?.addEventListener("resize", () => {
      requestAnimationFrame(restoreNoteKeyboardScroll);
    });

    noteForm.addEventListener("submit", event => {
      event.preventDefault();
      saveNoteEditor();
      closeNoteEditor();
    });
    document.getElementById("cancelNote").addEventListener("click", () => {
      noteEditingRecordId = null;
      closeNoteEditor();
    });
    document.getElementById("cancelScreenshot").addEventListener("click", () => {
      screenshotDialog.close();
    });
    document.querySelectorAll("[data-shot-scope]").forEach(button => {
      button.addEventListener("click", async () => {
        if (button.disabled) return;
        const scope = button.dataset.shotScope;
        let items = [];
        if (scope === "current") {
          const current = currentScreenshotRecord();
          if (current) items = [current];
        } else if (scope === "selected") {
          const selected = records.find(record => record.id === selectedRecordId);
          if (selected) items = [selected];
        } else if (scope === "all") {
          items = [...records];
        }
        screenshotDialog.close();
        await shareCalculationImage(items);
      });
    });

    const keypad = document.querySelector(".keypad");

    keypad.addEventListener("contextmenu", event => {
      event.preventDefault();
    });
    keypad.addEventListener("selectstart", event => {
      event.preventDefault();
    });

    /*
      手指落在按鍵間的小縫時，改按最近的按鍵。只處理觸控筆／手指，
      而且原本已點中按鍵時不介入，避免一按出現兩次。
    */
    keypad.addEventListener("pointerup", event => {
      if (event.pointerType === "mouse" || event.target.closest("button")) return;

      const buttons = [...keypad.querySelectorAll("button")];
      let nearest = null;
      let nearestDistance = Infinity;

      buttons.forEach(button => {
        const rect = button.getBoundingClientRect();
        const dx = Math.max(rect.left - event.clientX, 0, event.clientX - rect.right);
        const dy = Math.max(rect.top - event.clientY, 0, event.clientY - rect.bottom);
        const distance = Math.hypot(dx, dy);
        if (distance < nearestDistance) {
          nearest = button;
          nearestDistance = distance;
        }
      });

      if (nearest && nearestDistance <= 16) {
        event.preventDefault();
        nearest.click();
      }
    });

    const backspace = document.getElementById("backspace");
    backspace.addEventListener("click", backspaceOnce);
    backspace.addEventListener("pointerdown", () => {
      clearTimeout(deleteTimer);
      deleteTimer = setTimeout(() => {
        deleteTimer = setInterval(backspaceOnce, 75);
      }, 420);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(eventName => {
      backspace.addEventListener(eventName, () => {
        clearTimeout(deleteTimer);
        clearInterval(deleteTimer);
        deleteTimer = null;
      });
    });

    document.addEventListener("keydown", event => {
      if (event.target.matches("input, textarea") || !notePanel.hidden || screenshotDialog.open) return;
      const key = event.key;
      if (/^\d$/.test(key)) appendNumber(key);
      if (key === ".") appendDot();
      if (key === "+") appendOperator("+");
      if (key === "-") appendOperator("−");
      if (key === "*") appendOperator("×");
      if (key === "/") appendOperator("÷");
      if (key === "(" || key === ")") smartParen();
      if (key.toLowerCase() === "x") useStoredX();
      if (key === "Backspace") backspaceOnce();
      if (key === "Enter" || key === "=") calculate();
      if (key === "Escape") clearInput();
    });

    renderTape();
    renderActionRow(null);
    render();
  </script>
</body>
</html>
